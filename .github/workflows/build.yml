name: Build DeskSkin (Windows)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Unit tests (parser + settings)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/DeskSkin | Out-Null
          Copy-Item build/Release/DeskSkin.exe dist/DeskSkin/
          Copy-Item -Recurse skins dist/DeskSkin/Skins
          Copy-Item README.txt dist/DeskSkin/

      - name: Smoke test - launch and confirm it stays running
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/DeskSkin/DeskSkin.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Get-Content dist/DeskSkin/DeskSkin.log -ErrorAction SilentlyContinue; throw "DeskSkin exited early (code $($p.ExitCode))" }
          Write-Host "---- DeskSkin.log ----"
          Get-Content dist/DeskSkin/DeskSkin.log
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DeskSkin-portable
          path: dist/DeskSkin
